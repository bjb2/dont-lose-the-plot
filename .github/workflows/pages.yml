name: Deploy examples

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - name: Rebuild and verify Alice example
        working-directory: examples/alice-in-wonderland
        run: |
          node ../../dist/cli.js ingest
          node ../../dist/cli.js extract
          node ../../dist/cli.js normalize
          node ../../dist/cli.js render
          node ../../dist/cli.js verify
          node ../../dist/cli.js site build
      - name: Rebuild and verify Common Sense example
        working-directory: examples/common-sense
        run: |
          node ../../dist/cli.js ingest
          node ../../dist/cli.js pilot
          node ../../dist/cli.js onboard --accept-recommended
          node ../../dist/cli.js extract
          node ../../dist/cli.js normalize
          node ../../dist/cli.js render
          node ../../dist/cli.js verify
          node ../../dist/cli.js site build
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/common-sense
          cp -R examples/alice-in-wonderland/site/public/. pages/
          cp -R examples/common-sense/site/public/. pages/common-sense/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
